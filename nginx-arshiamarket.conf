# Nginx reverse proxy for ArshiaMarket.ir — READY FOR PRODUCTION
# 1) Place: sudo cp nginx-arshiamarket.conf /etc/nginx/sites-available/arshiamarket
# 2) Enable: sudo ln -s /etc/nginx/sites-available/arshiamarket /etc/nginx/sites-enabled/
# 3) Test: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name arshiamarket.ir www.arshiamarket.ir;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name arshiamarket.ir www.arshiamarket.ir;

    ssl_certificate /etc/letsencrypt/live/arshiamarket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arshiamarket.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    client_body_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
    location ~ ^/api/(integrations|basalam-hook) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ /\.(env|git) { return 404; }

    access_log /var/log/nginx/arshiamarket-access.log;
    error_log /var/log/nginx/arshiamarket-error.log;
}
# After DNS points to server IP, run:
# sudo certbot --nginx -d arshiamarket.ir -d www.arshiamarket.ir
# pm2 restart all --update-env
